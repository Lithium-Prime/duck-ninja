name = "duck-ninja-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_ORIGIN = "http://localhost:5173"
API_BASE_URL = "http://localhost:8787"
# Set secrets via `wrangler secret` or .dev.vars — required at runtime:
# BETTER_AUTH_SECRET, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_REGION

[[d1_databases]]
binding = "DB"
database_name = "duck-ninja"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
